# 全栈本地环境：服务 + MySQL 8 + Redis 7 + Kafka 3.8（KRaft）
# 用法：
#   docker compose up -d --build        # 起全栈（服务端口 8080）
#   docker compose logs -f dws          # 看服务日志
#   docker compose down -v              # 连数据卷一起删
services:
  dws:
    build: .
    container_name: dws-server
    ports:
      - "8080:8080"
    command:
      - "--port"
      - "8080"
      - "--data"
      - "/data"
      - "--db-backend"
      - "mysql"
      - "--mysql-dsn"
      - "host=mysql;port=3306;user=dws;password=dws;db=dicomweb"
      - "--redis-url"
      - "redis://redis:6379"
      - "--kafka-brokers"
      - "kafka:9092"
      - "--stow-async"
    volumes:
      - dws-data:/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: dws-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dicomweb
      MYSQL_USER: dws
      MYSQL_PASSWORD: dws
    ports:
      - "3306:3306"
    command: ["--innodb-buffer-pool-size=256M"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    container_name: dws-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    container_name: dws-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  dws-data:
