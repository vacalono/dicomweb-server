name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # 快速路径：不依赖 DCMTK，跑通网络层 + HTTP 解析 + 存储 + 路由
  build-test:
    name: build & test (no DCMTK)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsqlite3-dev libgtest-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDWS_HAVE_DCMTK=OFF
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  # 完整路径：带 DCMTK，验证真实 DICOM 标签解析
  build-dcmtk:
    name: build & test (with DCMTK)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsqlite3-dev libgtest-dev libdcmtk-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDWS_HAVE_DCMTK=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  # 内存/未定义行为：AddressSanitizer + UndefinedBehaviorSanitizer
  sanitizers:
    name: build & test (ASan/UBSan)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsqlite3-dev libgtest-dev
      - name: Configure
        run: >
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DDWS_HAVE_DCMTK=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan -j"$(nproc)"
      - name: Unit tests
        run: ctest --test-dir build-asan --output-on-failure

  # MySQL 8 + Redis 7：验证双后端契约、QIDO 缓存与端到端 HIT/MISS
  mysql-redis:
    name: build & test (MySQL 8 + Redis 7)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dicomweb
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DWS_TEST_MYSQL_DSN: "host=127.0.0.1;port=3306;user=root;password=root;db=dicomweb"
      DWS_TEST_REDIS_URL: "redis://127.0.0.1:6379"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsqlite3-dev libgtest-dev libmariadb-dev libhiredis-dev
      - name: Configure (MySQL + Redis ON)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDWS_HAVE_DCMTK=OFF
          -DDWS_HAVE_MYSQL=ON -DDWS_HAVE_REDIS=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Unit tests (含 DAO 契约 + 缓存)
        run: ctest --test-dir build --output-on-failure
      - name: e2e（真 MySQL + 真 Redis，验证 x-cache HIT/MISS 与 STOW 失效）
        run: |
          ./build/dicomweb-server --port 18080 --data /tmp/dws-e2e \
            --db-backend mysql --mysql-dsn "$DWS_TEST_MYSQL_DSN" --redis-url "$DWS_TEST_REDIS_URL" &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "http://127.0.0.1:18080/studies"; then break; fi
            sleep 1
          done
          # 1) 先写一条实例（无 DCMTK 时 stub 从内容哈希派生 UID）
          curl -sf -X POST --data-binary "DICM-e2e-instance-1" \
            -H "Content-Type: application/dicom" "http://127.0.0.1:18080/studies" -o /tmp/stow.json
          cat /tmp/stow.json
          # 2) 第一次 QIDO：MISS
          curl -s -D /tmp/h1 -o /dev/null "http://127.0.0.1:18080/studies"
          grep -qi "x-cache: MISS" /tmp/h1 || { echo "first request should be MISS"; cat /tmp/h1; exit 1; }
          # 3) 第二次 QIDO：HIT
          curl -s -D /tmp/h2 -o /dev/null "http://127.0.0.1:18080/studies"
          grep -qi "x-cache: HIT" /tmp/h2 || { echo "second request should be HIT"; cat /tmp/h2; exit 1; }
          # 4) 再写一条：应失效缓存，下一次回到 MISS
          curl -sf -X POST --data-binary "DICM-e2e-instance-2" \
            -H "Content-Type: application/dicom" "http://127.0.0.1:18080/studies" -o /dev/null
          curl -s -D /tmp/h3 -o /dev/null "http://127.0.0.1:18080/studies"
          grep -qi "x-cache: MISS" /tmp/h3 || { echo "STOW should invalidate cache"; cat /tmp/h3; exit 1; }
          kill $SERVER_PID

  # P0 基线 + P1 缓存对比：同一 runner、同一份种子数据，先无缓存再有缓存
  bench:
    name: "bench baseline (QIDO: sqlite vs sqlite+redis)"
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsqlite3-dev libgtest-dev libhiredis-dev wrk python3-pip
          python3 -m pip install --quiet pydicom
      - name: Build (Release, sqlite + redis, DCMTK off)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDWS_HAVE_DCMTK=OFF -DDWS_HAVE_REDIS=ON
          cmake --build build -j"$(nproc)"
      - name: Seed once
        run: |
          ./build/dicomweb-server --port 8080 --data /tmp/dws-bench &
          SERVER_PID=$!
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8080/studies && break; sleep 1; done
          python3 scripts/bench_prepare.py http://127.0.0.1:8080 1500
          kill $SERVER_PID
      - name: Bench A（无缓存：sqlite）
        run: |
          ./build/dicomweb-server --port 8080 --data /tmp/dws-bench &
          SERVER_PID=$!
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8080/studies && break; sleep 1; done
          echo "### A: sqlite, cache=off" | tee /tmp/bench.txt
          bash scripts/bench.sh http://127.0.0.1:8080 10s 200 | tee -a /tmp/bench.txt
          echo "### A2: sqlite, cache=off, limit=1000 (big body)" | tee -a /tmp/bench.txt
          wrk -t4 -c100 -d10s --latency "http://127.0.0.1:8080/studies?limit=1000" | tee -a /tmp/bench.txt
          kill $SERVER_PID
      - name: Bench B（sqlite + redis 缓存）
        run: |
          ./build/dicomweb-server --port 8080 --data /tmp/dws-bench --redis-url redis://127.0.0.1:6379 &
          SERVER_PID=$!
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8080/studies && break; sleep 1; done
          # 命中率：同一查询连发 100 次，统计 X-Cache
          MISS=0; HIT=0
          for i in $(seq 1 100); do
            CODE=$(curl -s -D - -o /dev/null "http://127.0.0.1:8080/studies?limit=100" | grep -i "^x-cache:" | tr -d "\r" | awk "{print \$2}")
            if [ "$CODE" = "HIT" ]; then HIT=$((HIT+1)); else MISS=$((MISS+1)); fi
          done
          echo "### B: sqlite+redis, cache=on" | tee -a /tmp/bench.txt
          echo "hit_rate: hit=$HIT miss=$MISS" | tee -a /tmp/bench.txt
          bash scripts/bench.sh http://127.0.0.1:8080 10s 200 | tee -a /tmp/bench.txt
          echo "### B2: sqlite+redis, cache=on, limit=1000 (big body)" | tee -a /tmp/bench.txt
          wrk -t4 -c100 -d10s --latency "http://127.0.0.1:8080/studies?limit=1000" | tee -a /tmp/bench.txt
          kill $SERVER_PID
      - name: Upload bench output
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline
          path: |
            /tmp/bench.txt
            docs/bench_raw_*.txt
          if-no-files-found: warn

  # P2 第一片：限流（429）+ /metrics 可观测
  resilience:
    name: "resilience (rate limit 429 + /metrics)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsqlite3-dev libgtest-dev
      - name: Build (Release, no DCMTK)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDWS_HAVE_DCMTK=OFF
          cmake --build build -j"$(nproc)"
      - name: 限流与指标
        run: |
          ./build/dicomweb-server --port 18081 --data /tmp/dws-rl --rate-limit 50 &
          SERVER_PID=$!
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:18081/metrics && break; sleep 1; done
          # 并发打 300 个请求：限流 50 QPS，必然出现 429
          seq 1 300 | xargs -P20 -I{} curl -s -o /dev/null -w "%{http_code}\n" "http://127.0.0.1:18081/studies?limit=10" > /tmp/codes.txt
          echo "--- status 分布 ---"; sort /tmp/codes.txt | uniq -c
          OK=$(grep -c "^200$" /tmp/codes.txt || true)
          LIMITED=$(grep -c "^429$" /tmp/codes.txt || true)
          echo "200=$OK 429=$LIMITED"
          test "$OK" -gt 0
          test "$LIMITED" -gt 0 || { echo "限流没生效：一个 429 都没有"; exit 1; }
          # 指标里能看到请求与限流计数
          curl -s http://127.0.0.1:18081/metrics | tee /tmp/metrics.txt
          grep -q "^dicomweb_requests_total " /tmp/metrics.txt
          grep -q "^dicomweb_rate_limited_total " /tmp/metrics.txt
          grep -q "^dicomweb_request_duration_us_bucket" /tmp/metrics.txt
          RL=$(grep "^dicomweb_rate_limited_total " /tmp/metrics.txt | awk '{print $2}')
          test "$RL" -gt 0 || { echo "rate_limited_total 应 > 0"; exit 1; }
          kill $SERVER_PID
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-metrics
          path: |
            /tmp/metrics.txt
            /tmp/codes.txt
          if-no-files-found: warn

  # P2 故障演练：停掉 MySQL → 熔断打开 → 503 快速失败 → 启回 → 自愈
  drill:
    name: "fault drill (stop MySQL -> 503 -> recover)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsqlite3-dev libgtest-dev libmariadb-dev
      - name: Build (MySQL backend ON)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDWS_HAVE_DCMTK=OFF -DDWS_HAVE_MYSQL=ON
          cmake --build build -j"$(nproc)"
      - name: 启动 MySQL（容器，3307）
        run: |
          docker run -d --name dws-mysql -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=dicomweb -p 3307:3306 mysql:8.0
          for i in $(seq 1 60); do
            if docker exec dws-mysql mysqladmin ping -h127.0.0.1 -uroot -proot --silent >/dev/null 2>&1; then echo "mysql ready"; break; fi
            sleep 2
          done
          docker exec dws-mysql mysqladmin ping -h127.0.0.1 -uroot -proot --silent
      - name: 演练：kill → 503 → 恢复
        run: |
          DSN="host=127.0.0.1;port=3307;user=root;password=root;db=dicomweb"
          ./build/dicomweb-server --port 18082 --data /tmp/dws-drill --db-backend mysql --mysql-dsn "$DSN" &
          SERVER_PID=$!
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:18082/studies && break; sleep 1; done

          echo "=== 1) 正常态 ==="
          curl -s -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" http://127.0.0.1:18082/studies
          curl -s http://127.0.0.1:18082/metrics | grep -E "^dicomweb_(db_up|cache_up) "

          echo "=== 2) 停 MySQL ==="
          docker stop dws-mysql
          sleep 8
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18082/studies)
          TIME=$(curl -s -o /dev/null -w "%{time_total}" http://127.0.0.1:18082/studies)
          echo "down: status=$CODE time=${TIME}s"
          test "$CODE" = "503" || { echo "熔断未打开：期望 503，实际 $CODE"; curl -s http://127.0.0.1:18082/metrics | head -20; exit 1; }
          curl -s http://127.0.0.1:18082/metrics | tee /tmp/metrics-down.txt | grep -E "^dicomweb_(db_up|db_breaker) "

          echo "=== 3) 启回 MySQL，等自愈 ==="
          docker start dws-mysql
          for i in $(seq 1 60); do
            if docker exec dws-mysql mysqladmin ping -h127.0.0.1 -uroot -proot --silent >/dev/null 2>&1; then break; fi
            sleep 2
          done
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18082/studies)
            [ "$CODE" = "200" ] && break
            sleep 1
          done
          echo "recovered: status=$CODE"
          test "$CODE" = "200" || { echo "没有自愈"; curl -s http://127.0.0.1:18082/metrics | head -20; exit 1; }
          curl -s http://127.0.0.1:18082/metrics | tee /tmp/metrics-up.txt | grep -E "^dicomweb_(db_up|db_breaker) "
          kill $SERVER_PID
      - name: Cleanup mysql
        if: always()
        run: docker rm -f dws-mysql || true
      - name: Upload drill metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drill-metrics
          path: |
            /tmp/metrics-down.txt
            /tmp/metrics-up.txt
          if-no-files-found: warn

  # P3 STOW 异步化：Kafka 生产者 + 消费者入库，验证"最终一致"
  kafka-async:
    name: "kafka async stow (eventual indexing)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsqlite3-dev libgtest-dev librdkafka-dev
      - name: Build (Kafka ON)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDWS_HAVE_DCMTK=OFF -DDWS_HAVE_KAFKA=ON
          cmake --build build -j"$(nproc)"
      - name: 启动 Kafka（KRaft 单节点）
        run: |
          docker run -d --name dws-kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:3.8.0
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/9092) >/dev/null 2>&1; then echo "kafka port open"; break; fi
            sleep 2
          done
          (echo > /dev/tcp/127.0.0.1/9092) >/dev/null 2>&1
      - name: 异步入库（STOW → Kafka → consumer → QIDO）
        run: |
          ./build/dicomweb-server --port 18083 --data /tmp/dws-kafka \
            --kafka-brokers 127.0.0.1:9092 --stow-async &
          SERVER_PID=$!
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:18083/studies && break; sleep 1; done

          echo "=== 1) STOW 一条实例 ==="
          curl -s -X POST --data-binary "DICM-kafka-async-1" -H "Content-Type: application/dicom" \
            "http://127.0.0.1:18083/studies" | tee /tmp/stow.json
          grep -q '"ok":1' /tmp/stow.json

          echo "=== 2) 等消费者入库（最多 20s）==="
          OK=0
          for i in $(seq 1 20); do
            N=$(curl -s "http://127.0.0.1:18083/studies" | grep -o '"0020000D"' | wc -l)
            if [ "$N" -gt 0 ]; then OK=1; echo "indexed after ${i}s (studies=$N)"; break; fi
            sleep 1
          done
          test "$OK" = "1" || { echo "消费者没有入库（最终一致性失败）"; curl -s http://127.0.0.1:18083/metrics; exit 1; }

          echo "=== 3) 指标 ==="
          curl -s http://127.0.0.1:18083/metrics | tee /tmp/metrics-kafka.txt | grep -E "^dicomweb_stow_"
          PRODUCED=$(grep "^dicomweb_stow_async_produced_total " /tmp/metrics-kafka.txt | awk '{print $2}')
          CONSUMED=$(grep "^dicomweb_stow_consumed_total " /tmp/metrics-kafka.txt | awk '{print $2}')
          test "${PRODUCED:-0}" -ge 1
          test "${CONSUMED:-0}" -ge 1
          kill $SERVER_PID
      - name: Cleanup kafka
        if: always()
        run: docker rm -f dws-kafka || true
      - name: Upload kafka metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kafka-async-metrics
          path: |
            /tmp/metrics-kafka.txt
            /tmp/stow.json
          if-no-files-found: warn

  # P4 容器化：多阶段镜像 + compose 起全栈，走一遍真实 STOW/QIDO（异步入库）
  docker:
    name: "docker image + compose e2e"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: |
          docker build -t dws:ci .
          SIZE=$(docker image inspect -f '{{.Size}}' dws:ci)
          echo "image_size_bytes=$SIZE" | tee /tmp/image.txt
          python3 -c "import sys;b=int('$SIZE');print(f'image_size_mb={b/1048576:.1f}')" | tee -a /tmp/image.txt
      - name: compose 起全栈
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/studies; then echo "server up after ${i}s"; break; fi
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:8080/metrics
          docker compose ps
      - name: 容器内 STOW → 最终一致
        run: |
          curl -s -X POST --data-binary "DICM-docker-e2e-1" -H "Content-Type: application/dicom" \
            "http://127.0.0.1:8080/studies" | tee /tmp/stow.json
          grep -q '"ok":1' /tmp/stow.json
          OK=0
          for i in $(seq 1 30); do
            N=$(curl -s "http://127.0.0.1:8080/studies" | grep -o '"0020000D"' | wc -l)
            if [ "$N" -gt 0 ]; then OK=1; echo "indexed after ${i}s"; break; fi
            sleep 1
          done
          test "$OK" = "1" || { echo "compose 栈里没有入库"; docker compose logs --tail=80 dws; exit 1; }
          curl -s http://127.0.0.1:8080/metrics | tee /tmp/metrics-docker.txt | grep -E "^dicomweb_(db_up|cache_up|stow_)"
      - name: 日志与清理
        if: always()
        run: |
          docker compose logs --tail=120 || true
          docker compose down -v || true
      - name: Upload docker metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-e2e
          path: |
            /tmp/image.txt
            /tmp/metrics-docker.txt
            /tmp/stow.json
          if-no-files-found: warn
